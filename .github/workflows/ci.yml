name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck functions *.sh tests/*.sh

  e2e:
    needs: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, slow]
    name: e2e (${{ matrix.profile }})
    env:
      # "slow": every container gets a quarter of a CPU, like a busy laptop or a small VM.
      ZKM_DOCKER_RUN_OPTS: ${{ matrix.profile == 'slow' && '--cpus=0.25' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t baseimage-zookeeper -f DockerfileZ .
          docker build -t baseimage-kafka -f DockerfileK .
      - name: End-to-end (3 ZK + 2 Kafka -> 2 + 1 -> 3 + 2)
        run: E2E_SKIP_BUILD=1 tests/e2e.sh
      - name: Logs on failure
        if: failure()
        run: |
          cat log.log || true
          docker ps -a
          for c in $(docker ps -q --filter ancestor=baseimage-kafka); do
            echo "--- kafka $c"; docker exec "$c" tail -50 /home/kafka/logs/server.log || true
          done
          for c in $(docker ps -q --filter ancestor=baseimage-zookeeper); do
            echo "--- zookeeper $c"; docker exec "$c" bash -c 'cat /etc/zookeeper/conf/zoo.cfg; tail -50 /var/log/zookeeper/*.log' || true
          done
